<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:* https://*; worker-src 'self' blob:;" />
    <title>AuraCommand</title>
    <script>
      // polyfill for uuid in browser context
      if (typeof globalThis.crypto === 'undefined') {
        globalThis.crypto = {
          getRandomValues: function(arr) {
            for (let i = 0; i < arr.length; i++) {
              arr[i] = Math.floor(Math.random() * 256);
            }
            return arr;
          },
          randomUUID: function() {
            const arr = new Uint8Array(16);
            this.getRandomValues(arr);
            arr[6] = (arr[6] & 0x0f) | 0x40;
            arr[8] = (arr[8] & 0x3f) | 0x80;
            const hex = Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
            return hex.slice(0,8) + '-' + hex.slice(8,12) + '-' + hex.slice(12,16) + '-' + hex.slice(16,20) + '-' + hex.slice(20);
          }
        };
      }
    </script>
    <script>
      // Polyfill for Promise.withResolvers (needed by pdfjs-dist 3.x)
      if (typeof Promise.withResolvers === 'undefined') {
        Promise.withResolvers = function() {
          let resolve, reject;
          const promise = new this((res, rej) => { resolve = res; reject = rej; });
          return { promise, resolve, reject };
        };
      }
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
